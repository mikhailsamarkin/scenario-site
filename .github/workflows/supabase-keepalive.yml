name: Supabase Keep-Alive

# Keep-alive для free-tier Supabase (dev + prod): каждые 6 часов пользовательский
# запрос к БД через PostgREST (GET /rest/v1/keepalive?select=id&limit=1), чтобы
# проекты не попадали под авто-паузу после 7 дней без активности.
# Документация Supabase говорит про «a few requests each day», поэтому 4 раза в
# сутки надёжнее ежедневного пинга.
#
# Важно: Supabase считает активностью только user database activity (PostgREST
# запросы к таблице exposed-схемы public). Запросы к Storage API (/storage/…),
# Auth и Management API в метрику не входят — на одном Storage-пинге проект
# всё равно уходил в паузу.
#
# Требования:
# - Таблица public.keepalive в обоих проектах (см. scripts/supabase-keepalive.mjs).
# - GitHub Secrets: SUPABASE_URL_DEV, SUPABASE_ANON_KEY_DEV,
#   SUPABASE_URL_PROD, SUPABASE_ANON_KEY_PROD.
#   Anon keys — публичные клиентские ключи (лежат в .env.local / бандле),
#   секрет не критичен, но храним в secrets для единообразия с daily-push.
#
# Ограничение GitHub: cron отключается для репозиториев без активности 60 дней.

on:
  schedule:
    # Каждые 6 часов (00:00/06:00/12:00/18:00 UTC = 03:00/09:00/15:00/21:00 МСК).
    - cron: '0 */6 * * *'
  workflow_dispatch: {} # ручной запуск для проверки

jobs:
  supabase-keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run keep-alive
        env:
          SUPABASE_URL_DEV: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_ANON_KEY_DEV: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
          SUPABASE_URL_PROD: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY_PROD: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
        run: node scripts/supabase-keepalive.mjs